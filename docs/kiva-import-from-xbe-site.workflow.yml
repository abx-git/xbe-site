name: Import from xbe-site (kiva-export)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kiva-export (real Kiva PWA, not Vault)
        uses: actions/checkout@v4
        with:
          repository: abx-git/xbe-site
          ref: kiva-export
          persist-credentials: false

      - name: Push to abx-git/kiva main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main --force
