name: Import from xbe-site (kiva-standalone)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-from-xbe-site.yml

# workflows: write is required because kiva-standalone includes .github/workflows/deploy.yml
permissions:
  contents: write
  workflows: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kiva-standalone from xbe-site
        uses: actions/checkout@v4
        with:
          repository: abx-git/xbe-site
          ref: kiva-standalone
          persist-credentials: false

      - name: Publish to abx-git/kiva main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main --force
