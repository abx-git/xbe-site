name: Sync Kiva to abx-git/kiva

# Pushes branch kiva-standalone (standalone Kiva app) to abx-git/kiva main.
# Prefer import workflow in abx-git/kiva (see docs/KIVA-REPOSITORY.md) — no PAT.
# This job needs a personal PAT in KIVA_REPO_PUSH_TOKEN with Contents: Write on kiva (org tokens often get 403).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-kiva-repository.yml
      - .github/kiva-sync-trigger

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kiva-standalone
        uses: actions/checkout@v4
        with:
          ref: kiva-standalone
          fetch-depth: 1
          # Do not persist GITHUB_TOKEN — it only has access to xbe-site and would override the PAT on push.
          persist-credentials: false

      - name: Push to abx-git/kiva
        env:
          KIVA_REPO_PUSH_TOKEN: ${{ secrets.KIVA_REPO_PUSH_TOKEN }}
        run: |
          if [ -z "$KIVA_REPO_PUSH_TOKEN" ]; then
            echo "::error::Missing secret KIVA_REPO_PUSH_TOKEN. See docs/KIVA-REPOSITORY.md"
            exit 1
          fi
          OWNER=$(curl -fsS -H "Authorization: Bearer ${KIVA_REPO_PUSH_TOKEN}" https://api.github.com/user | jq -r '.login // empty')
          echo "Token owner: ${OWNER}"
          if [ "$OWNER" = "abx-git" ]; then
            echo "::error::KIVA_REPO_PUSH_TOKEN belongs to the org account abx-git — git push is often blocked. Create a fine-grained PAT while logged in as your personal user (not the org), with Contents write on abx-git/kiva, and update the secret. Or use the import workflow in abx-git/kiva (see docs/KIVA-REPOSITORY.md)."
            exit 1
          fi
          echo "Push permission on abx-git/kiva:"
          curl -fsS -H "Authorization: Bearer ${KIVA_REPO_PUSH_TOKEN}" https://api.github.com/repos/abx-git/kiva | jq -r '.permissions.push // .message'
          git config --local credential.helper ""
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add kiva "https://x-access-token:${KIVA_REPO_PUSH_TOKEN}@github.com/abx-git/kiva.git"
          git push kiva HEAD:main --force
